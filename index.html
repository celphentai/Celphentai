<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Catalog</title>
    <meta name="referrer" content="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabecera fija: buscador + etiquetas -->
    <header class="site-header">
        <input type="search" id="searchBar" class="search-bar"
               placeholder="Buscar personaje, animador o universo..."
               autocomplete="off" autocapitalize="off" spellcheck="false">

        <div class="tags-row">
            <div id="tagsList" class="tags-list"></div>
            <!-- Sortea otras 5 etiquetas (solo visible cuando el buscador está vacío) -->
            <button id="rerollBtn" class="reroll-btn" type="button" aria-label="Mostrar otras etiquetas">🔄</button>
        </div>
    </header>

    <main class="catalog">
        <div id="resultsCounter" class="results-counter">Cargando catálogo...</div>
        <div id="catalogGrid" class="catalog-grid"></div>
        <button id="moreBtn" class="more-btn" type="button" hidden>Ver más</button>
    </main>

    <script src="app.js"></script>
</body>
</html>
